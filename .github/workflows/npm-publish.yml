name: Publish npm packages

on:
  release:
    types: [published]
  # Default dispatch is diagnostic-only; recovery is explicitly pinned to v0.2.0.
  workflow_dispatch:
    inputs:
      operation:
        description: Diagnose only, or resume the approved v0.2.0 publication
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - recover-v0.2.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Publish point-grab packages
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency:
      group: point-grab-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run verify:release
        env:
          POINT_GRAB_RELEASE_DIR: ${{ runner.temp }}/point-grab-verified-tarballs

      - name: Verify release tag and package versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packages = [
            'angular', 'core', 'mcp-server', 'react', 'solid', 'svelte', 'vue', 'web-components'
          ].map((name) => `packages/${name}/package.json`);
          const versions = packages.map((path) => JSON.parse(fs.readFileSync(path, 'utf8')).version);
          if (new Set(versions).size !== 1) throw new Error(`Package versions differ: ${versions.join(', ')}`);
          if (process.env.RELEASE_TAG !== `v${versions[0]}`) {
            throw new Error(`Expected tag v${versions[0]}, received ${process.env.RELEASE_TAG}`);
          }
          NODE
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Inspect publish tarballs
        run: |
          for dir in packages/angular packages/core packages/mcp-server packages/react packages/solid packages/svelte packages/vue packages/web-components; do
            version=$(node -p "require('./$dir/package.json').version")
            tar -tzf "$RUNNER_TEMP/point-grab-verified-tarballs/point-grab-${dir#packages/}-$version.tgz"
          done

      - name: Refuse to overwrite published versions
        run: |
          for dir in packages/angular packages/core packages/mcp-server packages/react packages/solid packages/svelte packages/vue packages/web-components; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; aborting."
              exit 1
            fi
          done

      - name: Publish packages with provenance
        run: |
          for dir in packages/core packages/angular packages/react packages/solid packages/svelte packages/vue packages/web-components packages/mcp-server; do
            version=$(node -p "require('./$dir/package.json').version")
            npm publish "$RUNNER_TEMP/point-grab-verified-tarballs/point-grab-${dir#packages/}-$version.tgz" --provenance --access public
          done

  # Controller is pinned to this run; source stays on the original release.
  recover:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-v0.2.0'
    name: Recover approved v0.2.0 npm publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    concurrency:
      group: point-grab-npm-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out recovery controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .recovery-controller
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: 7d03457cb315d685835afcf2448e36524a7a2923
          path: release-source
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 9.15.0
          package_json_file: release-source/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml

      - name: Test recovery controller and dispatch boundaries
        working-directory: .recovery-controller
        run: node --test scripts/recover-npm-v020.test.mjs scripts/recovery-workflow.test.mjs scripts/check-npm-oidc.test.mjs scripts/npm-recovery-trust.test.mjs

      - name: Preflight trusted publishing for every remaining package
        run: |
          node --input-type=module <<'NODE'
          import { diagnoseNpmOidc } from '../.recovery-controller/scripts/check-npm-oidc.mjs';
          let failed = false;
          for (const name of ['core', 'angular', 'react', 'svelte', 'vue', 'web-components', 'mcp-server']) {
            const result = await diagnoseNpmOidc({
              packageName: `@point-grab/${name}`,
              mask: (value) => console.log(`::add-mask::${value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A')}`),
            });
            console.log(JSON.stringify(result));
            if (!result.ok) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run verify:release
        env:
          POINT_GRAB_RELEASE_DIR: ${{ runner.temp }}/point-grab-recovery-validation

      # Publish original GitHub assets, never newly rebuilt tarballs.
      # Preflight every package before the first registry write.
      - name: Resume exact approved artifacts and verify registry readback
        run: node ../.recovery-controller/scripts/recover-npm-v020.mjs

  diagnose:
    name: Diagnose npm trusted publishing (no publication)
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'diagnose' || inputs.operation == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Verify diagnostic safety tests
        run: node --test scripts/check-npm-oidc.test.mjs

      # This dispatch has its selected ref/event claims, not the original release claims.
      # A successful exchange here is not proof that npm publication succeeded.
      - name: Inspect npm-audience token exchange without publishing
        run: node scripts/check-npm-oidc.mjs
