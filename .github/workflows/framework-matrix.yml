name: Framework browser regression

on:
  pull_request:
  push:
    branches: [main, release/solid-screenshot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build only packages, topologically and sequentially; don't start the demo fleet.
      - run: pnpm --filter './packages/**' --workspace-concurrency=1 run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Seven real framework demos, one server and worker at a time
        run: pnpm exec node scripts/verify-framework-matrix.mjs
      - name: Shared current-page capture negative and clipboard regressions
        run: pnpm exec playwright test --config=playwright.page-capture.config.ts
      - name: Shared freeze lifecycle, hover, transition and WAAPI regressions
        run: pnpm exec playwright test --config=playwright.freeze.config.ts
      - name: Solid interactive storefront and mobile regressions
        run: pnpm exec playwright test --config=examples/solid/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: framework-browser-failure-evidence
          path: test-results/
          retention-days: 7
